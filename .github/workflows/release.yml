name: Release Charts

on:
  push:
    branches:
      - master
  workflow_dispatch: {}

permissions:
  contents: read

# Releases push commits to master and rewrite index.yaml on gh-pages. Two runs
# doing that at once would collide, so never run this workflow concurrently.
concurrency:
  group: release-charts
  cancel-in-progress: false

env:
  HELM_VERSION: v4.2.4
  YQ_VERSION: v4.53.3
  CR_VERSION: 1.8.1

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      # @semantic-release/git pushes release commits and tags to master,
      # cr upload creates GitHub Releases, cr index pushes to gh-pages.
      contents: write
    steps:
      # The `secrets` context is not available to a step-level `if`, so the
      # presence of the key is turned into a plain output first. Passing the key
      # through job-level `env` would work too, but would put it in the
      # environment of every step in the job rather than just the one below.
      - name: Check for Twingate configuration
        id: twingate
        env:
          SERVICE_KEY: ${{ secrets.TWINGATE_SERVICE_KEY }}
        run: |
          if [ -n "$SERVICE_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Twingate skipped::TWINGATE_SERVICE_KEY is not set"
          fi

      # Nothing in this job is known to need private network access: cr talks to
      # api.github.com, the push goes to github.com, and helm dependency update
      # reaches public chart repos. The step is kept because it predates this
      # workflow rewrite and its original purpose is unconfirmed, but it no
      # longer fails the release when the key is absent, which also lets the
      # workflow run on a fork.
      - name: Connect to Twingate
        if: steps.twingate.outputs.enabled == 'true'
        uses: twingate/github-action@a8e6c2471f32650531a4683f45e485a2e97e048c # v1.5
        with:
          service-key: ${{ secrets.TWINGATE_SERVICE_KEY }}

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # semantic-release needs full history and tags to find the last release.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up Helm
        uses: azure/setup-helm@fe7b79cd5ee1e45176fcad797de68ecaf3ca4814 # v4.2.0
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install yq and chart-releaser
        run: |
          set -euo pipefail
          sudo curl -fsSLo /usr/local/bin/yq \
            "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          sudo chmod +x /usr/local/bin/yq
          curl -fsSL \
            "https://github.com/helm/chart-releaser/releases/download/v${CR_VERSION}/chart-releaser_${CR_VERSION}_linux_amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin cr
          yq --version
          cr version

      - name: Install release tooling
        run: npm ci

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Charts are released one at a time in a single checkout. Each chart's
      # release commit lands locally before the next chart runs, so every push is
      # a fast-forward. Splitting this into a job matrix would break: every matrix
      # job checks out the same immutable github.sha, so the second chart to push
      # is always based on a stale master and gets rejected.
      #
      # Every chart is attempted on every run, not just the ones changed in this
      # push. semantic-release decides per chart whether there is anything to
      # release, so a chart whose previous release failed recovers on the next run.
      - name: Release charts
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -uo pipefail
          export GITHUB_REPOSITORY_NAME="${GITHUB_REPOSITORY#*/}"

          failed=""
          for dir in charts/*/; do
            chart="$(basename "$dir")"

            if [ ! -f "${dir}.releaserc.json" ]; then
              echo "::warning title=Chart skipped::${chart} has no .releaserc.json"
              continue
            fi

            echo "::group::${chart}"
            if ( cd "$dir" && npx semantic-release ); then
              echo "::endgroup::"
            else
              echo "::endgroup::"
              echo "::error title=Release failed::${chart}"
              failed="${failed} ${chart}"
            fi
          done

          if [ -n "$failed" ]; then
            echo "Charts that failed to release:${failed}"
            exit 1
          fi
