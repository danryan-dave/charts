name: Lint Branch Name

# Reference implementation of the Jira-ticket check, moved off the commit/PR
# title so the conventional-commit header stays clean. Run this alongside the
# existing SOC-CI title check for one sprint, then fold this rule into SOC-CI and
# drop the title-based one.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  lint-branch-name:
    runs-on: ubuntu-latest
    steps:
      - name: Check branch name contains a Jira ticket
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          set -uo pipefail
          pattern='^(feature|fix|chore|hotfix)/[A-Z][A-Z0-9]+-[0-9]+-'
          if printf '%s' "$BRANCH" | grep -Eq "$pattern"; then
            echo "Branch '$BRANCH' is valid."
            exit 0
          fi
          echo "::error title=Invalid branch name::'$BRANCH' must match ${pattern}"
          echo "Example: feature/SRE-7229-add-node-selector"
          exit 1
