name: Helm Lint

on:
  pull_request:
    branches:
      - '**'

permissions:
  contents: read

env:
  HELM_VERSION: v4.2.4

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Helm
        uses: azure/setup-helm@fe7b79cd5ee1e45176fcad797de68ecaf3ca4814 # v4.2.0
        with:
          version: ${{ env.HELM_VERSION }}

      # Guards the "adding a new chart" checklist: a chart without a release
      # config is silently never released, and a wrong tagFormat would start the
      # chart's version history over at 1.0.0.
      - name: Verify release config for every chart
        run: |
          set -uo pipefail
          rc=0

          # A chart deleted upstream while a branch adds a release config leaves
          # a directory holding only .releaserc.json. It looks like a chart to
          # the release loop but has no Chart.yaml to package.
          for cfg in charts/*/.releaserc.json; do
            dir="$(dirname "$cfg")"
            if [ ! -f "${dir}/Chart.yaml" ]; then
              echo "::error title=Orphaned release config::${cfg} has no sibling Chart.yaml"
              rc=1
            fi
          done

          for dir in charts/*/; do
            chart="$(basename "$dir")"
            cfg="${dir}.releaserc.json"

            if [ ! -f "$cfg" ]; then
              echo "::error title=Missing release config::${cfg} does not exist"
              rc=1
              continue
            fi

            expected="${chart}-\${version}"
            actual="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("tagFormat",""))' "$cfg")"
            if [ "$actual" != "$expected" ]; then
              echo "::error title=Wrong tagFormat::${cfg} has '${actual}', expected '${expected}'"
              rc=1
            fi

            name="$(grep -E '^name:' "${dir}Chart.yaml" | head -1 | sed 's/^name:[[:space:]]*//')"
            if [ "$name" != "$chart" ]; then
              echo "::error title=Name mismatch::${dir}Chart.yaml name '${name}' must match directory '${chart}'"
              rc=1
            fi
          done
          exit $rc

      - name: Lint charts
        run: |
          set -uo pipefail
          rc=0
          for dir in charts/*/; do
            chart="$(basename "$dir")"
            echo "::group::helm lint ${chart}"
            # Resolve declared subcharts first; helm lint warns and helm package
            # fails outright when dependencies are missing from charts/.
            if ! ( cd "$dir" && helm dependency update . && helm lint . ); then
              echo "::error title=helm lint failed::${chart}"
              rc=1
            fi
            echo "::endgroup::"
          done
          exit $rc
